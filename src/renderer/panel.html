<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>单词猫咪 · 打卡面板</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>单词打卡</h1>
        <p id="streak-line">正在载入今天的进度…</p>
      </div>
      <button id="refresh-button" class="ghost refresh-button" type="button" title="重新读取最新数据">刷新</button>
    </header>

    <section class="stats" aria-label="学习统计">
      <article><span id="stat-new">0</span><label>今日新词</label></article>
      <article><span id="stat-review">0</span><label>今日复习</label></article>
      <article><span id="stat-streak">0</span><label>连续天数</label></article>
      <article><span id="stat-total">0</span><label>累计学习</label></article>
    </section>

    <main class="workspace">
      <div class="primary-column">
        <section class="card checkin-card">
          <div class="card-head"><h2>今日进度</h2><span id="today-date"></span></div>
          <div class="goal-row"><div><strong id="new-progress-count">0 / 10</strong><span id="new-progress-label">还差 10 个新词</span></div><div><strong id="review-progress-count">0 / 20</strong><span id="review-progress-label">还差 20 个复习词</span></div></div>
          <div class="progress-track" role="progressbar" aria-label="新词进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="new-progress-fill"></div></div>
          <div class="progress-track" role="progressbar" aria-label="复习进度" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="review-progress-fill"></div></div>
          <div class="checkin-actions">
            <button id="new-word-button" type="button">记录一个新词</button>
            <button id="review-word-button" type="button">记录一次复习</button>
            <button id="undo-new-button" class="ghost undo-button" type="button" title="撤销一个最新记录的新词">撤销新词</button>
            <button id="undo-review-button" class="ghost undo-button" type="button" title="撤销一个最新记录的复习">撤销复习</button>
          </div>
        </section>

        <section class="card chat-card">
          <div class="card-head"><h2>和猫咪聊聊</h2><button id="clear-chat" class="icon-command" type="button" title="清空对话" aria-label="清空对话">×</button></div>
          <div id="chat-list" class="chat-list"><p class="empty">可直接说“记 3 个新词”或“撤销一次打卡”。</p></div>
          <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行" required></textarea>
            <button type="submit">发送</button>
          </form>
        </section>
      </div>

      <aside>
        <section class="card">
          <div class="card-head"><h2>打卡设置</h2></div>
          <form id="settings-form" class="settings">
            <label>每日新词目标<input id="new-goal" type="number" min="0" max="500" required></label>
            <label>每日复习目标<input id="review-goal" type="number" min="0" max="500" required></label>
            <button type="submit">保存学习目标</button>
          </form>
        </section>

        <section class="card">
          <div class="card-head"><h2>StepFun 设置</h2></div>
          <form id="api-form" class="settings">
            <label>API Key<input id="api-key" type="password" placeholder="API Key" autocomplete="off"></label>
            <label>模型<input id="model" value="step-3.7-flash" autocomplete="off"></label>
            <label>接口地址<input id="endpoint" type="url" placeholder="https://api.stepfun.com/step_plan/v1/chat/completions" autocomplete="off"></label>
            <button type="submit">保存 API 设置</button>
          </form>
        </section>
      </aside>
    </main>

    <section class="card history">
      <div class="card-head"><h2>最近 14 天</h2><span>点击日期补录</span></div>
      <div id="history" class="history-grid"></div>
    </section>
  </div>

  <div id="toast" role="status"></div>
  <div id="record-modal" class="modal hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="record-title">
      <h3 id="record-title">补录</h3>
      <label>新词数量<input id="record-new-count" type="number" min="0" max="500"></label>
      <label>复习数量<input id="record-review-count" type="number" min="0" max="500"></label>
      <div class="modal-actions"><button id="record-cancel" class="ghost" type="button">取消</button><button id="record-save" type="button">保存</button></div>
    </div>
  </div>
  <script src="chat-actions.js"></script>
  <script src="panel.js"></script>
</body>
</html>
